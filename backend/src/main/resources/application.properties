spring.application.name=EmergencyMesh

# --- Database: PostgreSQL (target, SRS / Tech Stack Report) -----------------
# Override with env vars DB_URL / DB_USER / DB_PASSWORD. For a quick run with no
# Postgres installed, use the dev profile instead (in-memory H2).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emergency_mesh}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Errors come back as RFC 9457 problem+json instead of an HTML page.
spring.mvc.problemdetails.enabled=true

# --- Security -----------------------------------------------------------------
# Gateway phones send one of these in the X-API-Key header (comma-separated list).
mesh.gateway.api-keys=${MESH_GATEWAY_API_KEYS:dev-gateway-key}
# Responder dashboard login (HTTP Basic). Change these for any real deployment.
mesh.responder.username=${MESH_RESPONDER_USER:responder}
mesh.responder.password=${MESH_RESPONDER_PASSWORD:responder123}

# --- Crypto (FR-3) ---------------------------------------------------------------
# sealed = libsodium sealed boxes (default). plaintext = debugging only.
mesh.crypto.mode=${MESH_CRYPTO_MODE:sealed}
# Base64 X25519 private key. Normally loaded from secrets/mesh-keys.properties,
# which `./gradlew genKeys` creates. MESH_PRIVATE_KEY overrides it.
mesh.crypto.private-key=${MESH_PRIVATE_KEY:}
spring.config.import=optional:file:./secrets/mesh-keys.properties
